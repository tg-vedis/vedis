<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Консалтингова агенція Vedis." />
    <title>Vedis — Консалтингова агенція</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0f1b1a;
        --bg-soft: #16302c;
        --text: #f4f1e8;
        --muted: #a9bdb8;
        --accent: #c9a86a;
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 0%, var(--bg-soft), var(--bg) 65%);
        color: var(--text);
        font-family: "DM Sans", system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .wrap { max-width: 560px; }
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 3px;
        font-size: 13px;
        color: var(--accent);
        margin: 0 0 18px;
      }
      h1 {
        font-family: "Playfair Display", serif;
        font-weight: 600;
        font-size: clamp(36px, 7vw, 56px);
        margin: 0 0 16px;
        letter-spacing: 0.5px;
      }
      h1 span { color: var(--accent); }
      p.lead {
        color: var(--muted);
        font-size: 18px;
        line-height: 1.6;
        margin: 0 0 40px;
      }
      .divider {
        width: 56px;
        height: 1px;
        background: var(--accent);
        margin: 0 auto 40px;
        opacity: 0.6;
      }
      .contact {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--text);
        text-decoration: none;
        border: 1px solid rgba(244, 241, 232, 0.25);
        border-radius: 999px;
        padding: 12px 26px;
        font-size: 15px;
        transition: border-color 0.2s ease, background 0.2s ease;
      }
      .contact:hover {
        border-color: var(--accent);
        background: rgba(201, 168, 106, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="eyebrow">Незабаром</p>
      <h1>Консалтингова<br />агенція <span>Vedis</span></h1>
      <p class="lead">Ми готуємо новий сайт. Дякуємо за терпіння — зовсім скоро тут буде більше інформації про наші послуги.</p>
      <div class="divider"></div>
      <a class="contact" href="mailto:tg@vedis.com.ua">tg@vedis.com.ua</a>
    </div>
  </body>
</html>
